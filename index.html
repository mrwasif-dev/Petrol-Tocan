<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e3b46">
<title>Fuel Token Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#0b1f26; --petrol:#0e3b46; --petrol-2:#14515f; --amber:#f2a900;
  --bg:#e8edef; --card:#fff; --line:#d3dce0; --muted:#586a72;
  --ready:#0f8a5f; --ready-bg:#dff3ea; --soon:#9a5b00; --soon-bg:#fdeccb;
  --wait:#35566a; --wait-bg:#e3ecf1; --danger:#b3261e; --focus:#1c6fd1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--asphalt);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}

/* header: a road with a dashed centre line */
header{background:var(--petrol);color:#fff;padding:22px 0 20px}
header::after{content:"";display:block;height:6px;margin-top:20px;background:repeating-linear-gradient(90deg,var(--amber) 0 30px,transparent 30px 48px)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:1.1;letter-spacing:.01em}
.sub{margin:4px 0 0;color:#a9c3cb}
.stats{margin:0;font-size:17px;color:#fff}
.stats b{color:var(--amber);font-weight:600}

.bar{display:flex;justify-content:space-between;align-items:center;margin:22px 0 14px}
.bar h2{margin:0;font-size:20px;font-weight:600}

button{font:inherit;font-weight:500;cursor:pointer;border:0;border-radius:8px;padding:6px 16px;min-height:44px}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn-primary{background:var(--petrol);color:#fff}
.btn-accent{background:var(--amber);color:#1e1600;font-weight:600}
.btn-take{background:var(--ready);color:#fff;font-weight:600}
.btn-ghost{background:transparent;color:var(--asphalt);border:1px solid #b6c4ca}
.btn-danger{background:transparent;color:var(--danger);border:1px solid #e3b5b1}
.btn-sm{min-height:34px;padding:2px 12px;font-size:14px;border-radius:6px}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px;padding-bottom:70px}
.bike{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bike.ready{border-color:var(--ready);box-shadow:0 0 0 2px var(--ready-bg)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

/* the bike number is drawn as a number plate */
.plate{display:inline-block;background:#fff;color:var(--asphalt);border:2px solid var(--asphalt);border-radius:5px;padding:0 12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1.25;letter-spacing:.05em;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3px rgba(11,31,38,.35)}
.status{font-weight:600;font-size:14px;padding:1px 12px;border-radius:999px;white-space:nowrap;background:var(--wait-bg);color:var(--wait)}
.soon .status,.chip.soon{background:var(--soon-bg);color:var(--soon)}
.ready .status,.chip.ready{background:var(--ready-bg);color:var(--ready)}
.chip{font-weight:600;font-size:14px;padding:1px 12px;border-radius:999px;background:var(--wait-bg);color:var(--wait)}

.who{margin:0;color:var(--muted)}
.who b{color:var(--asphalt);font-weight:600}

/* seven segments, one for each day of the cycle */
.gauge{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.gauge i{height:10px;border-radius:2px;background:#d7e0e4}
.gauge i.on{background:var(--wait)}
.soon .gauge i.on{background:var(--soon)}
.ready .gauge i.on{background:var(--ready)}

.count{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;line-height:1.1}
.meta{margin:0;color:var(--muted);font-size:14px}
.tokenline{display:flex;align-items:center;gap:8px;background:#f1f5f6;border-radius:8px;padding:4px 6px 4px 12px;font-size:15px}
.tokenline span{color:var(--muted)}
.tokenline b{font-family:'Barlow Condensed',sans-serif;font-size:19px;letter-spacing:.03em;flex:1;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.actions .grow{flex:1;min-width:140px}
.empty{grid-column:1/-1;background:var(--card);border:2px dashed #b6c4ca;border-radius:14px;padding:34px 16px;text-align:center;color:var(--muted)}

dialog{border:0;border-radius:16px;padding:0;width:min(460px,94vw);max-height:92vh;color:var(--asphalt);background:#fff}
dialog.wide{width:min(640px,94vw)}
dialog::backdrop{background:rgba(8,20,26,.6)}
form,.dbody{padding:20px;display:grid;gap:14px}
dialog h3{margin:0;font-size:21px;font-weight:600}
label{display:grid;gap:4px;font-size:14px;color:var(--muted);font-weight:500}
input,textarea{font:inherit;color:var(--asphalt);padding:8px 12px;border:1px solid #aebdc4;border-radius:8px;min-height:46px;width:100%;background:#fff}
textarea{min-height:130px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.hint{margin:0;font-size:14px;padding:6px 12px;border-radius:8px;background:#eef2f4;color:var(--muted)}
.hint.ok{background:var(--ready-bg);color:#0b6b49}
.hint.warn{background:var(--soon-bg);color:var(--soon)}

/* detail view */
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec{border-top:1px solid var(--line);padding-top:12px}
.sec h4{margin:0 0 6px;font-size:16px;font-weight:600}
dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:6px 12px}
dt{color:var(--muted)}
dd{margin:0;font-weight:500;overflow-wrap:anywhere}
@media (max-width:420px){dl{grid-template-columns:1fr;gap:0}dd{margin-bottom:8px}}
.bigtoken{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bigtoken b{font-family:'Barlow Condensed',sans-serif;font-size:34px;letter-spacing:.04em;line-height:1.1;overflow-wrap:anywhere}
pre{margin:8px 0 0;padding:10px 12px;background:#f1f5f6;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:14px;max-height:180px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:600;color:var(--muted);padding:4px 8px 4px 0;border-bottom:1px solid var(--line)}
td{padding:6px 8px 6px 0;border-bottom:1px solid #edf1f3;vertical-align:middle}
td.tk{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:.03em}
.tablewrap{overflow-x:auto}

.toast{position:fixed;left:0;right:0;bottom:16px;margin:auto;width:max-content;max-width:92vw;background:var(--asphalt);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="wrap head">
    <div>
      <h1>Fuel Token Tracker</h1>
      <p class="sub">Weekly petrol subsidy tokens for every bike</p>
    </div>
    <p class="stats" id="stats" aria-live="polite"></p>
  </div>
</header>

<main class="wrap">
  <div class="bar">
    <h2>Bikes</h2>
    <button class="btn-accent" data-act="new">Add bike</button>
  </div>
  <section class="list" id="list" aria-live="polite"></section>
</main>

<!-- Add / edit bike -->
<dialog id="bikeDlg">
  <form id="bikeForm" method="dialog">
    <h3 id="bikeTitle">New bike</h3>
    <label>Bike number
      <input name="bikeNumber" required maxlength="20" placeholder="e.g. LEA-0786" autocomplete="off">
    </label>
    <div class="two">
      <label>SIM holder name
        <input name="simName" maxlength="60" placeholder="e.g. Ali Khan" autocomplete="off">
      </label>
      <label>SIM number
        <input name="simNumber" inputmode="tel" maxlength="20" placeholder="0300 1234567" autocomplete="off">
      </label>
    </div>
    <label>Last token collected at
      <input name="lastTokenAt" type="datetime-local" required>
    </label>
    <div class="row">
      <button type="submit" class="btn-primary" id="bikeSave">Save</button>
      <button type="button" class="btn-ghost" data-close="bikeDlg">Cancel</button>
    </div>
  </form>
</dialog>

<!-- Add token from the received message -->
<dialog id="tokDlg">
  <form id="tokForm" method="dialog">
    <h3 id="tokTitle">Add token</h3>
    <label>Paste the full message
      <textarea name="message" placeholder="Paste the token message you received here. The bike number and token number are picked out automatically."></textarea>
    </label>
    <div class="two">
      <label>Bike number found
        <input name="bikeNumber" maxlength="20" autocomplete="off">
      </label>
      <label>Token number found
        <input name="tokenNumber" maxlength="40" autocomplete="off">
      </label>
    </div>
    <p class="hint" id="tokHint">Paste a message to begin.</p>
    <div class="row">
      <button type="submit" class="btn-primary" id="tokSave" disabled>Save token</button>
      <button type="button" class="btn-ghost" data-close="tokDlg">Cancel</button>
    </div>
  </form>
</dialog>

<!-- Details -->
<dialog id="detDlg" class="wide">
  <div class="dbody" id="detBody"></div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const HOUR = 3600 * 1000;
const DAY = 24 * HOUR;
const $ = (s) => document.querySelector(s);
let bikes = [];
let editingId = null;
let tokenBikeId = null;
let detailId = null;

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const byId = (id) => bikes.find((b) => b._id === id);

const api = async (url, method = 'GET', body) => {
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
  return data;
};

const toast = (msg) => {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 2800);
};

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast('Copied');
}

const toLocalInput = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
const fmtShort = (d) => d.toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const fmtFull = (d) => d.toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function fmtLeft(ms) {
  const total = Math.max(0, Math.floor(ms / 60000));
  const d = Math.floor(total / 1440);
  const h = Math.floor((total % 1440) / 60);
  const m = total % 60;
  const parts = [];
  if (d) parts.push(plural(d, 'day'));
  if (h) parts.push(plural(h, 'hour'));
  if (!d) parts.push(plural(m, 'minute'));
  return parts.join(' ');
}

function stateOf(b, now) {
  const left = new Date(b.nextTokenAt).getTime() - now;
  if (left <= 0) return 'ready';
  return left <= DAY ? 'soon' : 'wait';
}
const STATE_LABEL = { ready: 'Token ready', soon: 'Due soon', wait: 'Waiting' };
const latestToken = (b) => (b.tokens && b.tokens.length ? b.tokens[0] : null);

/* ------------------------------------------------------------------ */
/* Message reader: finds the bike number and token number in a message */
/* ------------------------------------------------------------------ */
const STOP = new Set(['TOKEN', 'NO', 'ID', 'SMS', 'PKR', 'RS', 'THE', 'FOR', 'YOUR', 'CODE', 'DATE', 'TIME', 'BIKE', 'VEHICLE']);

function parseMessage(text, preferred) {
  const msg = String(text || '').replace(/\r/g, '');
  const upper = msg.toUpperCase();
  let bike = '';

  // 1. a bike already saved in the app, preferring the one being edited
  const candidates = [preferred, ...bikes.filter((b) => !preferred || b._id !== preferred._id)].filter(Boolean);
  for (const b of candidates) {
    const chars = b.bikeKey.split('').map((c) => c.replace(/[^A-Z0-9]/g, '')).join('[\\s-]*');
    if (chars && new RegExp(`(^|[^A-Z0-9])${chars}($|[^A-Z0-9])`).test(upper)) { bike = b.bikeNumber; break; }
  }

  // 2. a number written next to a label such as "Vehicle No"
  if (!bike) {
    const labelled = upper.match(/(?:VEHICLE|VEH|BIKE|MOTORCYCLE|M\/C|REGISTRATION|REG)\.?[^\S\n]*(?:NO\.?|NUMBER|NUM|#)?[^\S\n]*[:=\-]?[^\S\n]*([A-Z]{2,4}[\s-]?\d{1,4}(?:[\s-]?\d{2,4})?|\d{3,6})/);
    if (labelled) bike = labelled[1].replace(/\s+/g, '-');
  }

  // 3. anything that looks like a number plate
  if (!bike) {
    const re = /(^|[^A-Z0-9])([A-Z]{2,4})[\s-]?(\d{3,4})(?:[\s-]?(\d{2}))?(?![A-Z0-9])/g;
    let m;
    while ((m = re.exec(upper))) {
      if (!STOP.has(m[2])) { bike = `${m[2]}-${m[3]}${m[4] ? '-' + m[4] : ''}`; break; }
    }
  }

  // a short number such as 0786 matches the saved bike whose number ends the same way
  if (bike && /^\d+$/.test(norm(bike))) {
    const hit = candidates.find((b) => b.bikeKey.endsWith(norm(bike)));
    if (hit) bike = hit.bikeNumber;
  }

  // token number: after the word "token", otherwise the most code-like value
  const bikeKey = norm(bike);
  const looksLikePhone = (v) => /^(?:\+?92|0)?3\d{9}$/.test(v.replace(/[^\d+]/g, ''));
  const looksLikeDate = (v) => /^\d{1,4}-\d{1,2}-\d{1,4}$/.test(v);
  const ok = (v) => v && norm(v) !== bikeKey && !looksLikePhone(v) && !looksLikeDate(v);

  let token = '';
  const labelRe = /(?:TOKEN|\u0679\u0648\u06a9\u0646)[^\S\n]*(?:NO\.?|NUMBER|NUM|ID|CODE|#)?[^\S\n]*(?:IS|:|-|=|#)?[^\S\n]*((?=[A-Z0-9-]*\d)[A-Z0-9][A-Z0-9-]{3,})/gi;
  let t;
  while ((t = labelRe.exec(msg))) {
    if (ok(t[1])) { token = t[1]; break; }
  }
  if (!token) {
    const codes = (upper.match(/(?=[A-Z0-9-]*\d)[A-Z0-9][A-Z0-9-]{5,}/g) || []).filter(ok);
    codes.sort((a, b) => b.length - a.length);
    token = codes[0] || '';
  }
  return { bike, token };
}

/* ------------------------------------------------------------------ */
/* Rendering                                                           */
/* ------------------------------------------------------------------ */
function card(b, now) {
  const st = stateOf(b, now);
  const next = new Date(b.nextTokenAt);
  const elapsed = Math.min(7, Math.max(0, Math.floor((now - new Date(b.lastTokenAt)) / DAY)));
  const filled = st === 'ready' ? 7 : elapsed;
  const seg = Array.from({ length: 7 }, (_, i) => `<i class="${i < filled ? 'on' : ''}"></i>`).join('');
  const tk = latestToken(b);
  const who = [b.simName && `<b>${esc(b.simName)}</b>`, b.simNumber && esc(b.simNumber)].filter(Boolean).join(' on SIM ');
  return `<article class="bike ${st}">
    <div class="top">
      <span class="plate">${esc(b.bikeNumber)}</span>
      <span class="status">${STATE_LABEL[st]}</span>
    </div>
    ${who ? `<p class="who">${who}</p>` : ''}
    <div class="gauge" role="img" aria-label="${filled} of 7 days passed">${seg}</div>
    <p class="count">${st === 'ready' ? 'Available now' : `${fmtLeft(next.getTime() - now)} left`}</p>
    <p class="meta">Next token: ${fmtShort(next)}</p>
    ${tk ? `<div class="tokenline"><span>Token</span><b>${esc(tk.tokenNumber)}</b><button class="btn-ghost btn-sm" data-copy="${esc(tk.tokenNumber)}">Copy</button></div>` : ''}
    <div class="actions">
      ${st === 'ready' ? `<button class="btn-take grow" data-act="collect" data-id="${b._id}">Token collected</button>` : ''}
      ${b.tokenPending ? `<button class="btn-accent grow" data-act="addtoken" data-id="${b._id}">Add token</button>` : ''}
      <button class="btn-ghost" data-act="details" data-id="${b._id}">Details</button>
    </div>
  </article>`;
}

function render() {
  const now = Date.now();
  const sorted = [...bikes].sort((a, b) => new Date(a.nextTokenAt) - new Date(b.nextTokenAt));
  const ready = sorted.filter((b) => stateOf(b, now) === 'ready').length;
  const soon = sorted.filter((b) => stateOf(b, now) === 'soon').length;
  $('#stats').innerHTML = bikes.length
    ? `<b>${plural(bikes.length, 'bike')}</b>: ${ready} ready now, ${soon} due within 24 hours`
    : '';
  $('#list').innerHTML = sorted.length
    ? sorted.map((b) => card(b, now)).join('')
    : '<div class="empty">No bikes yet.<br>Tap "Add bike" and enter its number and the time of its last token.</div>';
  if ($('#detDlg').open && detailId) renderDetails(detailId);
}

function summaryText(b) {
  const tk = latestToken(b);
  return [
    `Bike number: ${b.bikeNumber}`,
    b.simName ? `SIM holder: ${b.simName}` : '',
    b.simNumber ? `SIM number: ${b.simNumber}` : '',
    `Last token collected: ${fmtFull(new Date(b.lastTokenAt))}`,
    `Next token due: ${fmtFull(new Date(b.nextTokenAt))}`,
    tk ? `Latest token number: ${tk.tokenNumber}` : ''
  ].filter(Boolean).join('\n');
}

function renderDetails(id) {
  const b = byId(id);
  if (!b) { $('#detDlg').close(); return; }
  const now = Date.now();
  const st = stateOf(b, now);
  const tk = latestToken(b);
  const row = (k, v, copy) => v ? `<dt>${k}</dt><dd>${esc(v)}${copy ? ` <button class="btn-ghost btn-sm" data-copy="${esc(v)}">Copy</button>` : ''}</dd>` : '';
  const history = (b.tokens || []).map((t) => `<tr>
      <td>${fmtShort(new Date(t.addedAt))}</td>
      <td class="tk">${esc(t.tokenNumber)}</td>
      <td><button class="btn-ghost btn-sm" data-copy="${esc(t.tokenNumber)}">Copy</button>
          <button class="btn-danger btn-sm" data-act="rmtoken" data-id="${b._id}" data-tid="${t._id}">Remove</button></td>
    </tr>`).join('');

  $('#detBody').innerHTML = `
    <div class="dhead">
      <span class="plate">${esc(b.bikeNumber)}</span>
      <span class="chip ${st}">${STATE_LABEL[st]}</span>
    </div>
    <div class="sec"><h4>Bike and SIM</h4><dl>
      ${row('Bike number', b.bikeNumber, true)}
      ${row('SIM holder', b.simName)}
      ${row('SIM number', b.simNumber, true)}
    </dl></div>
    <div class="sec"><h4>Schedule</h4><dl>
      ${row('Last collected', fmtFull(new Date(b.lastTokenAt)))}
      ${row('Next token due', fmtFull(new Date(b.nextTokenAt)))}
      ${row('Time left', st === 'ready' ? 'Available now' : fmtLeft(new Date(b.nextTokenAt).getTime() - now))}
    </dl></div>
    <div class="sec"><h4>Latest token</h4>
      ${tk ? `<div class="bigtoken"><b>${esc(tk.tokenNumber)}</b><button class="btn-ghost btn-sm" data-copy="${esc(tk.tokenNumber)}">Copy token</button></div>
        <dl style="margin-top:8px">
          ${row('Added', fmtFull(new Date(tk.addedAt)))}
          ${row('Message was for', tk.bikeNumber)}
        </dl>
        ${tk.message ? `<pre>${esc(tk.message)}</pre><div style="margin-top:8px"><button class="btn-ghost btn-sm" data-copy="${esc(tk.message)}">Copy message</button></div>` : ''}`
        : '<p class="meta">No token saved yet. Use "Add token" and paste the message you received.</p>'}
    </div>
    ${history ? `<div class="sec"><h4>Token history</h4><div class="tablewrap"><table>
      <thead><tr><th>Added</th><th>Token</th><th></th></tr></thead><tbody>${history}</tbody></table></div></div>` : ''}
    <div class="row sec">
      <button class="btn-primary" data-act="copysummary" data-id="${b._id}">Copy details</button>
      <button class="btn-accent" data-act="addtoken" data-id="${b._id}">Add token</button>
      <button class="btn-ghost" data-act="edit" data-id="${b._id}">Edit</button>
      <button class="btn-danger" data-act="delete" data-id="${b._id}">Delete</button>
      <button class="btn-ghost" data-close="detDlg">Close</button>
    </div>`;
}

/* ------------------------------------------------------------------ */
/* Dialogs                                                             */
/* ------------------------------------------------------------------ */
function openBike(b) {
  editingId = b ? b._id : null;
  $('#bikeTitle').textContent = b ? 'Edit bike' : 'New bike';
  const f = $('#bikeForm');
  f.bikeNumber.value = b ? b.bikeNumber : '';
  f.simName.value = b ? b.simName : '';
  f.simNumber.value = b ? b.simNumber : '';
  f.lastTokenAt.value = toLocalInput(b ? new Date(b.lastTokenAt) : new Date());
  $('#bikeDlg').showModal();
  f.bikeNumber.focus();
}

function openToken(id) {
  tokenBikeId = id;
  const b = byId(id);
  const f = $('#tokForm');
  f.reset();
  f.bikeNumber.dataset.dirty = '';
  f.tokenNumber.dataset.dirty = '';
  $('#tokTitle').textContent = `Add token for ${b.bikeNumber}`;
  updateTokenHint();
  $('#tokDlg').showModal();
  f.message.focus();
}

function updateTokenHint() {
  const f = $('#tokForm');
  const b = byId(tokenBikeId);
  const hint = $('#tokHint');
  const typed = norm(f.bikeNumber.value);
  const token = f.tokenNumber.value.trim();
  $('#tokSave').disabled = !token;
  if (!f.message.value.trim() && !token) { hint.className = 'hint'; hint.textContent = 'Paste a message to begin.'; return; }
  if (!typed) { hint.className = 'hint warn'; hint.textContent = 'No bike number found in the message. You can type it above.'; return; }
  if (typed === b.bikeKey) { hint.className = 'hint ok'; hint.textContent = `Bike number matches ${b.bikeNumber}.`; return; }
  const other = bikes.find((x) => x.bikeKey === typed);
  hint.className = 'hint warn';
  hint.textContent = other
    ? `This message is for ${other.bikeNumber}, not ${b.bikeNumber}. Close this and add it to ${other.bikeNumber} instead.`
    : `This message mentions ${f.bikeNumber.value}, which does not match ${b.bikeNumber}.`;
}

$('#tokForm').message.addEventListener('input', (e) => {
  const f = e.target.form;
  const found = parseMessage(f.message.value, byId(tokenBikeId));
  if (!f.bikeNumber.dataset.dirty) f.bikeNumber.value = found.bike;
  if (!f.tokenNumber.dataset.dirty) f.tokenNumber.value = found.token;
  updateTokenHint();
});
['bikeNumber', 'tokenNumber'].forEach((n) => {
  $('#tokForm')[n].addEventListener('input', (e) => { e.target.dataset.dirty = '1'; updateTokenHint(); });
});

$('#bikeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const body = {
    bikeNumber: f.bikeNumber.value.trim(),
    simName: f.simName.value.trim(),
    simNumber: f.simNumber.value.trim(),
    lastTokenAt: new Date(f.lastTokenAt.value).toISOString()
  };
  $('#bikeSave').disabled = true;
  try {
    if (editingId) await api(`/api/bikes/${editingId}`, 'PUT', body);
    else await api('/api/bikes', 'POST', body);
    $('#bikeDlg').close();
    toast('Saved');
    await load();
  } catch (err) { toast(err.message); }
  $('#bikeSave').disabled = false;
});

$('#tokForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  $('#tokSave').disabled = true;
  try {
    await api(`/api/bikes/${tokenBikeId}/tokens`, 'POST', {
      tokenNumber: f.tokenNumber.value.trim(),
      bikeNumber: f.bikeNumber.value.trim(),
      message: f.message.value.trim()
    });
    $('#tokDlg').close();
    toast('Token saved');
    await load();
    detailId = tokenBikeId;
    renderDetails(detailId);
    $('#detDlg').showModal();
  } catch (err) {
    toast(err.message);
    $('#tokSave').disabled = false;
  }
});

/* ------------------------------------------------------------------ */
/* Actions                                                             */
/* ------------------------------------------------------------------ */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('button');
  if (!el) return;
  if (el.dataset.close) { document.getElementById(el.dataset.close).close(); return; }
  if (el.dataset.copy !== undefined) { copyText(el.dataset.copy); return; }
  const act = el.dataset.act;
  if (!act) return;
  const id = el.dataset.id;
  try {
    if (act === 'new') openBike(null);
    else if (act === 'edit') { $('#detDlg').close(); openBike(byId(id)); }
    else if (act === 'addtoken') { $('#detDlg').close(); openToken(id); }
    else if (act === 'details') { detailId = id; renderDetails(id); $('#detDlg').showModal(); }
    else if (act === 'copysummary') copyText(summaryText(byId(id)));
    else if (act === 'collect') {
      const b = await api(`/api/bikes/${id}/collect`, 'POST', {});
      toast(`Next token: ${fmtShort(new Date(b.nextTokenAt))}`);
      await load();
    } else if (act === 'rmtoken') {
      if (confirm('Remove this token from the history?')) { await api(`/api/bikes/${id}/tokens/${el.dataset.tid}`, 'DELETE'); await load(); }
    } else if (act === 'delete') {
      const b = byId(id);
      if (confirm(`Delete ${b.bikeNumber} and all of its tokens?`)) {
        await api(`/api/bikes/${id}`, 'DELETE');
        $('#detDlg').close();
        toast('Deleted');
        await load();
      }
    }
  } catch (err) { toast(err.message); }
});

async function load() {
  try { bikes = await api('/api/bikes'); render(); }
  catch (err) { $('#list').innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
}

load();
setInterval(render, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
